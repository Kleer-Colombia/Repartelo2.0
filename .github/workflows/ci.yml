name: CI

# Corre en cada PR (requisito para mergear) y en cada push a main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        # Misma versión mayor que producción (config/deploy.yml).
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RAILS_ENV: test
      DISABLE_SPRING: "1"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repartelo2_0_test
      PG_HOST: localhost
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Librerías de Postgres
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev

      # Versión de Ruby desde .ruby-version; gems cacheadas según Gemfile.lock.
      - name: Ruby + gems
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Base de test
        run: |
          cp config/database.ci.yml config/database.yml
          bin/rails db:create db:schema:load

      # Los specs (rspec) no necesitan Node ni assets compilados.
      - name: Tests
        run: bundle exec rspec
